# Bot-mitigation directives that must live in the http{} context. The
# matching server-context directives are in snap-bot-mitigation-server.conf,
# included from locations.conf.

map $host $robots_file {
    default                      static/robots.txt;
    staging.snap.berkeley.edu    static/robots-deny-all.txt;
    snap-cloud.cs10.org          static/robots-deny-all.txt;
    extensions.snap.berkeley.edu static/robots-deny-all.txt;
    # Should no longer be needed, but just in case
    staging.snap-cloud.cs10.org  static/robots-deny-all.txt;
    snap-staging.cs10.org        static/robots-deny-all.txt;
}

map $http_user_agent $bot_limit_key {
    default                  "";
    "~*(GPTBot|OAI-SearchBot|ChatGPT-User)"          $binary_remote_addr;
    "~*(ClaudeBot|Claude-SearchBot|Claude-User)"     $binary_remote_addr;
    "~*(PerplexityBot|Perplexity-User)"              $binary_remote_addr;
    "~*(CCBot|Amazonbot|Applebot|Bingbot)"           $binary_remote_addr;
}

limit_req_zone $bot_limit_key zone=slow_bots:10m rate=60r/m;

# UA blocklist for SEO crawlers that ignore robots.txt. \b word-boundaries
# guard against substring false positives (e.g. "yeti" inside a longer UA).
map $http_user_agent $snap_block_ua {
    default          0;
    ""               1;   # absent/blank UA
    "~*ahrefsbot"    1;
    "~*semrushbot"   1;
    "~*\bdotbot\b"   1;
    "~*mj12bot"      1;
    "~*sleepbot"     1;
    "~*\byeti\b"     1;
    "~*blexbot"      1;
    "~*petalbot"     1;
}
