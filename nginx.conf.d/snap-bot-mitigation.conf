# Bot-mitigation directives that must live in the http{} context. The
# matching server-context directives are in snap-bot-mitigation-server.conf,
# included from locations.conf.

map $host $robots_file {
    default                      static/robots.txt;
    staging.snap.berkeley.edu    static/robots-deny-all.txt;
    snap-cloud.cs10.org          static/robots-deny-all.txt;
    extensions.snap.berkeley.edu static/robots-deny-all.txt;
    snap-staging.cs10.org        static/robots-deny-all.txt;
}

map $http_user_agent $bot_limit_key {
    default                  "";
    "~*(GPTBot|OAI-SearchBot|ChatGPT-User)"          $binary_remote_addr;
    "~*(ClaudeBot|Claude-SearchBot|Claude-User)"     $binary_remote_addr;
    "~*(PerplexityBot|Perplexity-User)"              $binary_remote_addr;
    "~*(CCBot|Amazonbot|Applebot|Bingbot)"           $binary_remote_addr;
}

limit_req_zone $bot_limit_key zone=slow_bots:10m rate=60r/m;

# Per-IP limit for the two listing pages that have slower queries
# Only /explore and /search get a key; every other URI maps
# to "" and is not limited. Keyed on $uri, so the query string is ignored.
map $uri $listing_limit_key {
    default                  "";
    "~^/(explore|search)/?$" $binary_remote_addr;
}

limit_req_zone $listing_limit_key zone=listing_pages:10m rate=60r/m;

# Per-IP cap on requests *in flight* to Lapis (the /api/v1/ and @lapisapp
# locations; static files are not counted). A rate limit cannot stop a
# client that fires 150 requests in two seconds and then goes quiet, but
# that is exactly what exhausts a worker's DB pool (pool_size 10 + backlog
# 40 = 50 per worker, and one HTTP/2 client multiplexes onto one worker).
# 2026-10-29: 99 and 157 /project requests in 2 s each from one IP, 256
# pool errors, at 35% CPU. Legitimate school NATs peaked at 6 req/s today.
# Each HTTP/2 stream counts as one connection here.
limit_conn_zone $binary_remote_addr zone=lapis_per_ip:10m;

# UA blocklist for SEO crawlers that ignore robots.txt. \b word-boundaries
# guard against substring false positives (e.g. "yeti" inside a longer UA).
map $http_user_agent $snap_block_ua {
    default          0;
    ""               1;   # absent/blank UA
    "~*ahrefsbot"    1;
    "~*semrushbot"   1;
    "~*\bdotbot\b"   1;
    "~*mj12bot"      1;
    "~*sleepbot"     1;
    "~*\byeti\b"     1;
    "~*blexbot"      1;
    "~*petalbot"     1;
    # YisouSpider (Alibaba/Shenma): 18k requests and 36 GB of old_site video
    # downloads in 91 days (Aug-Oct 2026), ignores robots.txt.
    "~*yisouspider"  1;
}
