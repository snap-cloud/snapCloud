# Static fallbacks for errors generated by nginx. Keep the original HTTP status.
# Application-rendered errors (including JSON API responses) remain with Lapis.
error_page 401 /errors/401.html;
error_page 403 /errors/403.html;
error_page 404 /errors/404.html;
error_page 413 /errors/413.html;
error_page 418 /errors/418.html;
error_page 422 /errors/422.html;
error_page 429 /errors/429.html;
error_page 451 /errors/451.html;
error_page 500 /errors/500.html;
error_page 502 /errors/502.html;
error_page 503 /errors/503.html;
error_page 504 /errors/504.html;

# Bypass the community site's .html redirect and Lapis fallback, even if the
# application or database is unavailable. Only internal redirects may enter.
location ^~ /errors/ {
    internal;
    # Allow the 401 page to render without requiring staging credentials again.
    auth_basic off;
    alias static/errors/;
    default_type text/html;
    charset utf-8;
}

# Only the error page's shared assets are public on password-protected staging.
location = /static/errors/error.css {
    auth_basic off;
    access_log off;
    alias static/errors/error.css;
    default_type text/css;
}

location = /static/img/snap-logo-color.svg {
    auth_basic off;
    access_log off;
    alias static/img/snap-logo-color.svg;
    default_type image/svg+xml;
}

# A small easter egg; real application failures never use this status.
location = /teapot {
    return 418;
}
