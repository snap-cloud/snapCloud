# This is an HTTP-only front end that serves the Snap! IDE.
# https requests must end up back on http (see the :443 block), so this domain
# must NOT advertise HSTS or browsers loop https<->http.

server {
    listen 80;
    server_name extensions.snap.berkeley.edu;

    # The API must be accessed via https!
    set $cloud_loc '<head>\n\t<meta name="snap-cloud-domain" location="https://snap.berkeley.edu">';

    # Clear any HSTS policy on the extensions domain (it is http-only).
    add_header Strict-Transport-Security "max-age=0";

    include nginx.conf.d/snap-ide.conf;

    location / {
        return 301 /snap/;
    }

    # Needed for LetsEncrypt certbot to authenticate
    # Note: This is mapped to snapCloud/html/.well-known/acme-challenge
    # This must be accessible over a non-ssl connection
    location ~ /.well-known/acme-challenge/ {
        auth_basic off; # needed for the staging environment.
        alias html/;
        default_type "text/plain";
        try_files $uri $uri/ =404;
        break;
    }
}

# Send https visitors back to http. Two different browser behaviours have to
# be handled, and only a *sequence* of responses satisfies both:
#
#  * Cached HSTS. For about a day this block inherited the year-long HSTS header
#    from ssl-shared.conf, so visitors from that window have their browser
#    rewriting http -> https locally. Only a secure response carrying
#    `Strict-Transport-Security: max-age=0` clears that, and a 200 is the one
#    response every browser is known to process it on.
#
#  * HTTPS-first upgrading (Safari 27, Chrome, Firefox). The browser
#    optimistically loads every http navigation over https and only falls back
#    to http when the https load *fails*. A 200 counts as success (Safari then
#    stays on https and re-upgrades any later http link, so a shim that bounces
#    client-side just loops), and 4xx/5xx count as success too. The failure we
#    can produce while still sending headers is a redirect loop: a 301 back to
#    the *identical* URL over http. WebKit cancels that load as "HTTPS upgrade
#    redirect loop" (ResourceLoader::willSendRequestInternal, main frame,
#    upgraded request URL == redirecting URL) and reloads over http; Chrome and
#    Firefox treat a same-host https->http redirect the same way.
#
# So: the first https hit (no cookie) is a 200 shim that clears HSTS, sets a
# cookie and bounces to the same path over http. The browser upgrades that
# bounce, hits this block again with the cookie, gets the self-301 and falls
# back to http for real.
server {
    listen 443 ssl http2;
    server_name extensions.snap.berkeley.edu;

    # LetsEncrypt creates *.pem files by default.
    ssl_certificate     certs/extensions.snap.berkeley.edu/fullchain.pem;
    ssl_certificate_key certs/extensions.snap.berkeley.edu/privkey.pem;

    # Defining add_header here also drops the inherited year-long HSTS from
    # ssl-shared.conf. (add_header is only inherited by blocks that define
    # none of their own, hence the repeat inside location / below.)
    add_header Strict-Transport-Security "max-age=0" always;

    # Needed for LetsEncrypt certbot to authenticate
    # Note: This is mapped to snapCloud/html/.well-known/acme-challenge
    # This must be accessible over a non-ssl connection
    location ~ /.well-known/acme-challenge/ {
        auth_basic off; # needed for the staging environment.
        alias html/;
        default_type "text/plain";
        try_files $uri $uri/ =404;
        break;
    }

    location / {
        add_header Strict-Transport-Security "max-age=0" always;
        add_header Set-Cookie "ext_http=1; Path=/; Max-Age=31536000; Secure; SameSite=Lax" always;

        # Repeat https hit: redirect to the identical URL over http. This is the
        # loop HTTPS-first browsers detect and fall back from.
        if ($cookie_ext_http = "1") {
            return 301 http://$host$request_uri;
        }

        # First https hit: 200 shim. Clears HSTS (header above), sets the
        # cookie, and bounces to http client-side.
        default_type text/html;
        root .;
        try_files /static/extensions-redirect.html =404;
    }
}
