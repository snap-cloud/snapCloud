# This is an HTTP-only front end that serves the Snap! IDE.
# https requests are 301'd to the http domain, so this domain must NOT
# advertise HSTS (see the :443 block) or browsers loop https<->http.

server {
    listen 80;
    server_name extensions.snap.berkeley.edu;

    # The API must be accessed via https!
    set $cloud_loc '<head>\n\t<meta name="snap-cloud-domain" location="https://snap.berkeley.edu">';

    # Clear any HSTS policy on the extensions domain (it is http-only).
    add_header Strict-Transport-Security "max-age=0";

    include nginx.conf.d/snap-ide.conf;

    location / {
        return 301 /snap/;
    }

    # Needed for LetsEncrypt certbot to authenticate
    # Note: This is mapped to snapCloud/html/.well-known/acme-challenge
    # This must be accessible over a non-ssl connection
    location ~ /.well-known/acme-challenge/ {
        auth_basic off; # needed for the staging environment.
        alias html/;
        default_type "text/plain";
        try_files $uri $uri/ =404;
        break;
    }
}

# Force https connections to be sent to http.
server {
    listen 443 ssl http2;
    server_name extensions.snap.berkeley.edu;

    # https is used so that pre-redirect the browser will not complain.
    # LetsEncrypt creates *.pem files by default.
    ssl_certificate     certs/extensions.snap.berkeley.edu/fullchain.pem;
    ssl_certificate_key certs/extensions.snap.berkeley.edu/privkey.pem;

    # extensions is http-only (so the editor can load http:// resources), but
    # browsers force https via cached HSTS or "always-use-HTTPS" mode. Rather
    # than 301 https->http (which loops, and whose HSTS header Safari ignores on
    # a redirect), serve a 200 shim (location / below). max-age=0 on a 200 is
    # processed reliably and clears cached HSTS. Defining add_header here also
    # drops the inherited year-long HSTS from ssl-shared.conf.
    add_header Strict-Transport-Security "max-age=0" always;

    # Needed for LetsEncrypt certbot to authenticate
    # Note: This is mapped to snapCloud/html/.well-known/acme-challenge
    # This must be accessible over a non-ssl connection
    location ~ /.well-known/acme-challenge/ {
        auth_basic off; # needed for the staging environment.
        alias html/;
        default_type "text/plain";
        try_files $uri $uri/ =404;
        break;
    }
    # Serve a tiny 200 page (not a 301) that clears HSTS and bounces to the
    # http IDE client-side. The 200 lets the max-age=0 above take effect even
    # in Safari; the page has a one-shot guard so a browser that keeps forcing
    # https gets a clear message instead of an invisible redirect loop.
    location / {
        default_type text/html;
        root .;
        try_files /static/extensions-redirect.html =404;
    }
}
