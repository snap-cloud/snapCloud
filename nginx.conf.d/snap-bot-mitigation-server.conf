# Bot-mitigation directives that live in server{} context. Included from
# locations.conf so every server block (prod + staging, both hosts, plus
# dev) picks them up. The http-context map and limit_req_zone live in
# nginx.conf.d/snap-bot-mitigation.conf.

# Limit all bott defined in the $bot_limit_key map.
limit_req zone=slow_bots burst=10 nodelay;
# Limit /explore and /search per IP (see $listing_limit_key). 50 requests
# go through at once, then one every second; the rest get a 429.
# 50 requests is is overly generous, but ensures we won't accidentally block
# a classroom that shares an external IP.
limit_req zone=listing_pages burst=50 nodelay;
limit_req_status 429;

# 444 any user-agent flagged by $snap_block_ua.
if ($snap_block_ua) {
    return 444;
}

# Block all *.php requests which are just bots.
location ~* \.php$ {
    access_log off;
    return 444;
}

location ~* ^/(wp-admin|wp-login\.php|wp-includes|wp-content|wp-json|xmlrpc\.php) {
    access_log off;
    return 444;
}

location ~* ^/(phpmyadmin|pma|adminer|administrator|phpinfo) {
    access_log off;
    return 444;
}

location ~* /(\.env|\.git|\.aws|\.ssh|\.DS_Store|config\.php|wlwmanifest\.xml) {
    access_log off;
    return 444;
}

location ~* ^/(autodiscover|boaform|HNAP1|cgi-bin|vendor/phpunit) {
    access_log off;
    return 444;
}
