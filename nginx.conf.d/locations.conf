# Shared location configurations for all environments
# These are included in both the main SSL server block (prod) and non-SSL server block (dev).

include nginx.conf.d/error-pages.conf;

# Bot mitigation (robots.txt + UA blocklist). Included here so it is applied
# to every server block — both prod hosts, both staging hosts, and dev.
include nginx.conf.d/snap-bot-mitigation-server.conf;

# Serve robots.txt as a static file from the repo.
# We want to serve a file which is customized per-host.
# Only the primary server should be allowed to be crawled.
location = /robots.txt {
    access_log off;
    alias $robots_file;
    default_type text/plain;
}

# Specify the cloud domain each page should use.
set_by_lua_block $cloud_url { return os.getenv('CLOUD_URL') }
set_by_lua_block $cloud_loc {
    local ngx = require('ngx')
    if ngx.var.cloud_url then
        return '<head>\n\t<meta name="snap-cloud-domain" location="' .. ngx.var.cloud_url .. '">'
    else
        return 0
    end
}

if ($cloud_loc = 0) {
    set $cloud_loc '<head>\n\t<meta name="snap-cloud-domain" location="$scheme://$host:$server_port">';
}

# Block all *.php requests which are just bots.
location ~ \.php$ {
    deny all;
}

# The old public project download URL. The site stopped emitting it in May
# 2026 (every link now carries /api/v1/), but it is still in search indexes,
# forum posts and bookmarks. Redirect it here so Lapis never sees it; this
# also makes the ~14k scraper hits a day one nginx `return` each.
# Only the bare numeric id matches: /project?username=… (the site page) and
# /project/:id/flag etc. (API, POST) are untouched.
location ~ ^/project/(\d+)/?$ {
    return 301 /api/v1/project/$1$is_args$args;
}

# The community front-end, the snap-site repo compiled into site/www/
location / {
    alias static/;
    sub_filter <head> $cloud_loc;
    if ($request_uri ~ ^/(.*)\.html$) {
        return 302 /$1;
    }
    # This serves the files from old_site/ but at the same path as
    # requested, rather than redirecting.
    try_files $uri $uri.html @lapisapp;
}


# lapis API server back-end
location /api/v1/ {
    # At most 50 requests in flight per IP (zone in snap-bot-mitigation.conf).
    # 50 = one worker's pool slots; with http2_max_concurrent_streams 32 a
    # single connection cannot reach it. DRY RUN for now: 31 days of logs
    # (2026-09-29..10-29) show school NATs piling up to 50+ in flight on
    # ~24 IP-days a month, almost always on slow pages (/users, /search,
    # /api/v1/users/c under load). Flip limit_conn_dry_run off once #566,
    # #567, #570 have made those pages cheap and error.log shows no
    # "limiting connections, dry run" lines from school networks.
    limit_conn lapis_per_ip 50;
    limit_conn_dry_run on;
    default_type text/html;
    content_by_lua_block {
        require("lapis").serve("app")
    }
}

# Front-end files serves by lapis
# Any routes that's not a file can be redirected to Lapis
location @lapisapp {
    limit_conn lapis_per_ip 50;
    limit_conn_dry_run on;
    access_log logs/lapis_access.log main_ext if=$should_log;
    default_type text/html;
    content_by_lua_block {
        require("lapis").serve("app")
    }
}

# Static content from snapCloud
# Avoid unnecessarily logging data for CSS, JS, etc.
location /static/ {
    access_log off;
    alias static/;
}

# The old snap.berkeley.edu site with all its BYOB content, etc.
location /old_site {
    alias html/old_site/;
}

location /js-extensions {
    alias html/extensions/;
}

# Redirect /site/x to /x.
# These URLs were on the first version of the social site.
location ~ ^/site/?(.*) {
   return 301 $scheme://$http_host/$1$is_args$query_string;
}

include nginx.conf.d/snap-ide.conf;

