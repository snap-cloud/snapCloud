env HOSTNAME;
env SECONDARY_HOSTNAME;
env PORT;
env DATABASE_URL;
env DATABASE_HOST;
env DATABASE_PORT;
env DATABASE_USERNAME;
env DATABASE_PASSWORD;
env DATABASE_NAME;
# Connection pool sizing, see config.lua
env DATABASE_MAX_CONNECTIONS;
env DATABASE_RESERVED_CONNECTIONS;
env DATABASE_POOL_SIZE;
env DATABASE_POOL_BACKLOG;
env SESSION_SECRET_BASE;
env CODE_CACHE;
env DNS_RESOLVER;
env LOG_DIRECTIVE;
env MAIL_SMTP_USER;
env MAIL_SMTP_PASSWORD;
env MAIL_SMTP_SERVER;
env MAIL_SMTP_PORT;
env USE_DAEMON;
env WORKER_CONNECTIONS;
env DISCOURSE_SSO_SECRET;
env SENTRY_DSN;
env RELEASE_SHA;
env PROJECT_STORAGE_PATH;
env MAINTENANCE_MODE;
env STAT_ARGS;
env CLOUD_URL;

worker_processes ${{NUM_WORKERS}};
error_log ${{LOG_DIRECTIVE}};
daemon ${{USE_DAEMON}};
pid tmp/nginx.pid;

events {
    worker_connections ${{WORKER_CONNECTIONS}};
}

http {
    lua_shared_dict session_cache 150m;
    lua_shared_dict page_cache 512m;
    lua_shared_dict query_cache 512m;
    lua_shared_dict query_cache_categories 150m;

    init_by_lua_block {
        -- Include these two manually to prevent _G write guard warnings in logs
        require "lpeg"
        require "socket"
    }

    include nginx.conf.d/logging.conf;
    include nginx.conf.d/mime.types;
    include nginx.conf.d/snap-bot-mitigation.conf;

    resolver ${{DNS_RESOLVER}};

    lua_code_cache ${{CODE_CACHE}};

    client_body_buffer_size     10M;
    client_max_body_size        10M;

    # Just to keep the directory clean.
    client_body_temp_path tmp/nginx_client_body_temp;
    proxy_temp_path tmp/nginx_proxy_temp;
    fastcgi_temp_path tmp/nginx_fastcgi_temp;
    uwsgi_temp_path tmp/nginx_uwsgi_temp;
    scgi_temp_path tmp/nginx_scgi_temp;

    # Common HTTP Settings
    # TODO: This should be enabled, but we need to update nginx on the production server
    # http2 on;
    keepalive_timeout 70;

    # gzip — applied to every server/location below unless overridden.
    # gzip_static prefers a `.gz` sibling produced by bin/compress at
    # deploy time; gzip on still covers dynamic lapis responses (JSON
    # from /api/v1/ and HTML from @lapisapp). gzip_min_length skips tiny
    # responses where compression overhead isn't worth it; lapis
    # responses larger than ~1 KB — including the big JSON payloads
    # over 1 MB — get compressed.
    gzip on;
    gzip_static on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types *;

    # We use a separate server block for each host to serve specific certs.
    server {
        server_name ${{HOSTNAME}} ${{SECONDARY_HOSTNAME}};
        listen ${{PORT}};
        # nginx amplify listen
        listen 127.0.0.1:${{PORT}};

        include nginx.conf.d/${{NON_SSL_NGINX_CONFIG}};
    }

    # development: this is simply empty, otherwise it contains SSL settings.
    # do not include the `;`. It is included in config.lua
    ${{SSL_NGINX_SERVER_CONFIG}}
}
