/home/cloud/snapCloud/logs/*.log {
    daily
    missingok
    rotate 90
    maxage 120
    create
    dateext
    dateformat .%Y-%m-%d
    postrotate
         # authbind: lapis hup runs `nginx -t`, which binds :80/:443 — cloud needs authbind
         # to pass the test, else the reload aborts and logs are never reopened.
         cd /home/cloud/snapCloud && PATH=/home/cloud/snapCloud/lua_modules/bin:/usr/local/bin:$PATH authbind --deep lapis hup
    endscript
}
