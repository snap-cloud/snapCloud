/home/cloud/snapCloud/logs/*.log {
    daily
    missingok
    rotate 90
    maxage 120
    create
    dateext
    dateformat .%Y-%m-%d
    postrotate
         # USR1 tells nginx to reopen its log files. (`lapis hup` needs to run
         # from the app dir to find tmp/nginx.pid, which logrotate doesn't do.)
         [ -f /home/cloud/snapCloud/tmp/nginx.pid ] && kill -USR1 $(cat /home/cloud/snapCloud/tmp/nginx.pid)
    endscript
}
