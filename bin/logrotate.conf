/home/cloud/snapCloud/logs/*.log {
    daily
    missingok
    rotate 90
    maxage 120
    create
    dateext
    dateformat .%Y-%m-%d
    postrotate
         # Reload nginx so it reopens the log files. lapis finds logs/nginx.pid
         # from the app dir; cron's PATH doesn't include lapis.
         cd /home/cloud/snapCloud && PATH=/home/cloud/snapCloud/lua_modules/bin:/usr/local/bin:$PATH lapis hup
    endscript
}
